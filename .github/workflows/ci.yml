name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_test_sanitizers:
    name: Build, Test & Benchmark Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake liburing-dev

      - name: Build all targets
        run: make all CXX=clang++

      - name: Run test suite
        run: make test CXX=clang++

      - name: Run 100M packet zero-allocation pipeline
        run: ./bin/test_zero_allocation_pipeline 10000000

      - name: Run benchmarks
        run: make bench CXX=clang++

      - name: Verify AddressSanitizer & UBSan
        run: |
          make clean
          make SANITIZER=asan test CXX=clang++

      - name: Verify ThreadSanitizer
        run: |
          make clean
          make SANITIZER=tsan test CXX=clang++
